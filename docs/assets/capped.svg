<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="Truncation, and the rule that catches it">
<rect width="760" height="380" fill="#ffffff"/>
<text x="64" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1f2937">Truncation, and the rule that catches it</text>
<text x="64" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b7280">share of runs that stopped short, at the turn cap or the wall clock</text>
<line x1="64" y1="318.0" x2="736" y2="318.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="322.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">0%</text>
<line x1="64" y1="256.0" x2="736" y2="256.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="260.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">25%</text>
<line x1="64" y1="194.0" x2="736" y2="194.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="198.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">50%</text>
<line x1="64" y1="132.0" x2="736" y2="132.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="136.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">75%</text>
<line x1="64" y1="70.0" x2="736" y2="70.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="74.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">100%</text>
<rect x="138.4" y="318.0" width="88.5" height="0.0" fill="#2563eb" rx="2"/>
<text x="182.7" y="312.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2937">0%</text>
<text x="182.7" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1f2937">30 turns</text>
<rect x="359.7" y="106.2" width="88.5" height="211.8" fill="#b42318" rx="2"/>
<text x="404.0" y="100.2" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2937">85%</text>
<text x="404.0" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1f2937">20 turns</text>
<rect x="581.1" y="287.0" width="88.5" height="31.0" fill="#2563eb" rx="2"/>
<text x="625.3" y="281.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2937">12%</text>
<text x="625.3" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1f2937">calibrated</text>
<text x="64" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">Above 50 percent the gate refuses to decide, because the comparison would measure turn efficiency, not quality.</text>
</svg>