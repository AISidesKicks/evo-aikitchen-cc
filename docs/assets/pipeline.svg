<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 372" width="100%" role="img" aria-label="Pipeline diagram: task, workspace, agent, grader, ledger, gate and report on the host, with tools and the acceptance check running inside a bubblewrap sandbox">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="940" height="372" fill="#ffffff"/>
<text x="24" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">How one task runs</text>
<text x="24" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#6b7280">HOST</text>
<rect x="24" y="96" width="140" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="36" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Task card</text>
<text x="36" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">fixture + acceptance</text>
<rect x="176" y="96" width="140" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="188" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Workspace</text>
<text x="188" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">throwaway copy</text>
<rect x="328" y="96" width="140" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="340" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Agent loop</text>
<text x="340" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">Tau, max turns</text>
<rect x="480" y="96" width="140" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="492" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Grader</text>
<text x="492" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">acceptance check</text>
<rect x="632" y="96" width="140" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="644" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Ledger</text>
<text x="644" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">tokens, cost, turns</text>
<rect x="784" y="96" width="132" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="796" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Gate and report</text>
<text x="796" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">paired and budgeted</text>
<line x1="164" y1="128" x2="174" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="316" y1="128" x2="326" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="468" y1="128" x2="478" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="620" y1="128" x2="630" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="772" y1="128" x2="782" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="328" y="20" width="140" height="50" rx="8" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="340" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Model provider</text>
<text x="340" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">API, host only</text>
<line x1="398" y1="70" x2="398" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<text x="406" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7280">one call per turn</text>
<rect x="310" y="190" width="320" height="132" rx="10" fill="#fff7ed" stroke="#b42318" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="470" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b42318">bubblewrap: no network, no home, no keys</text>
<rect x="328" y="204" width="140" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="340" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Tools</text>
<text x="340" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">read, write, edit, bash</text>
<rect x="480" y="204" width="140" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="492" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f2937">The tests</text>
<text x="492" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">only the failing ones</text>
<line x1="398" y1="161" x2="398" y2="202" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head)"/>
<text x="406" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7280">tool calls and results</text>
<line x1="550" y1="161" x2="550" y2="202" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#head)"/>
<text x="558" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7280">runs it</text>
<text x="24" y="362" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280">The agent needs the model API, so it runs on the host. The tools do not, so they do not.</text>
</svg>